name: HydraReel validation
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The repository currently has no package-lock.json; npm ci and setup-node
      # npm caching both require a lockfile. Match the existing Docker build.
      - run: npm install --no-audit --no-fund
      - run: npm run validate
